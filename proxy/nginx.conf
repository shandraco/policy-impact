# The only container people reach. Open WebUI, the review page and signed downloads; nothing else.
# /gate, /tools and /check-reply are internal and answer 404 here.
worker_processes 1;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 25m;
  proxy_read_timeout 600s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=30s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  server {
    listen 8080;

    location ~ "^/review(/.*)?$" {
      set $api http://policy-api:8000;
      proxy_pass $api;
      proxy_set_header Host policy-api;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/exports/[0-9a-f-]{36}\.xlsx$" {
      limit_except GET { deny all; }
      set $api http://policy-api:8000;
      proxy_pass $api;
      proxy_set_header Host policy-api;
    }

    location ~ "^/(gate|tools|check-reply|health)" { return 404; }

    location / {
      set $owui http://open-webui:8080;
      proxy_pass $owui;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
